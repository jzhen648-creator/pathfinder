name: API smoke test

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_url:
        description: API base URL (preview or production)
        required: false
        default: https://pathfinder-chi-roan.vercel.app

jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Health check
        env:
          SMOKE_BASE_URL: ${{ github.event.inputs.base_url || 'https://pathfinder-chi-roan.vercel.app' }}
        run: |
          url="${SMOKE_BASE_URL%/}/api/health"
          code=$(curl -sS -o /tmp/health.json -w "%{http_code}" "$url")
          cat /tmp/health.json
          test "$code" = "200"

      - name: Authenticated smoke test
        env:
          SMOKE_BASE_URL: ${{ github.event.inputs.base_url || 'https://pathfinder-chi-roan.vercel.app' }}
          SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
        run: npm run smoke-test
