<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pathfinder · Stream confirmation</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Lora:ital,wght@0,400;0,500;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #07060A;
    --bg-1: #0F0F0F;
    --glass-bg: rgba(255,255,255,0.02);
    --glass-border: rgba(255,255,255,0.08);
    --glass-border-strong: rgba(255,255,255,0.14);
    --ink: rgba(255,255,255,0.94);
    --ink-2: rgba(255,255,255,0.62);
    --ink-3: rgba(255,255,255,0.42);
    --ink-4: rgba(255,255,255,0.26);

    --c-work: #EF9F27;
    --c-money: #1D9E75;
    --c-becoming: #7F77DD;
    --c-people: #D4537E;
    --c-health: #D85A30;

    --anno: #EF9F27;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Inter", system-ui, sans-serif;
    font-weight: 400;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  .viewport {
    position: fixed;
    inset: 0;
    overflow: hidden;
  }

  /* ─── tree layer (full-width, dimmed to 40%) ──────────────────────── */
  .tree-layer {
    position: absolute;
    inset: 0;
    opacity: 0.40;
    pointer-events: none;
  }
  .tree-layer svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  /* ─── right rail (480px glass) ─────────────────────────────────────── */
  .rail {
    position: absolute;
    top: 0; right: 0; bottom: 0;
    width: 480px;
    background:
      linear-gradient(to right, rgba(7,6,10,0.55), rgba(11,10,15,0.78));
    backdrop-filter: blur(24px) saturate(1.1);
    -webkit-backdrop-filter: blur(24px) saturate(1.1);
    border-left: 1px solid var(--glass-border);
    display: flex;
    flex-direction: column;
  }

  .rail-head {
    padding: 22px 28px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid rgba(255,255,255,0.045);
  }
  .wordmark {
    font-family: "Lora", serif;
    font-weight: 500;
    font-size: 19px;
    letter-spacing: 0.005em;
    color: var(--ink);
  }
  .wordmark .dot {
    display: inline-block;
    width: 4px; height: 4px;
    border-radius: 50%;
    background: var(--c-work);
    margin: 0 8px 3px;
    vertical-align: middle;
    box-shadow: 0 0 6px var(--c-work);
  }
  .rail-mode {
    font-family: "JetBrains Mono", monospace;
    font-size: 10.5px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-3);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .rail-mode .live {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--c-money);
    box-shadow: 0 0 6px var(--c-money);
  }

  .rail-context {
    padding: 14px 28px 4px;
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--ink-3);
    font-size: 12px;
    letter-spacing: 0.01em;
  }
  .rail-context .crumb-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--c-work);
    box-shadow: 0 0 8px var(--c-work);
  }
  .rail-context .sep { color: var(--ink-4); }

  .rail-content {
    flex: 1;
    overflow-y: auto;
    padding: 16px 28px 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    scrollbar-width: thin;
    scrollbar-color: rgba(255,255,255,0.08) transparent;
  }
  .rail-content::-webkit-scrollbar { width: 6px; }
  .rail-content::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.06); border-radius: 3px; }

  /* ─── cards ─────────────────────────────────────────────────────────── */
  .card {
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: 16px;
    padding: 18px 18px 16px;
    position: relative;
    transition: border-color 200ms ease, background 200ms ease;
  }
  .card:hover {
    border-color: var(--glass-border-strong);
    background: rgba(255,255,255,0.028);
  }

  .card-meta {
    font-family: "JetBrains Mono", monospace;
    font-size: 10.5px;
    letter-spacing: 0.10em;
    text-transform: uppercase;
    color: var(--ink-3);
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
  }
  .card-meta .ago { color: var(--ink-4); }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-family: "Inter", sans-serif;
    font-size: 11.5px;
    font-weight: 500;
    letter-spacing: 0.005em;
    text-transform: none;
    color: var(--ink-2);
    background: rgba(255,255,255,0.035);
    border: 1px solid var(--glass-border);
    padding: 4px 10px 4px 9px;
    border-radius: 999px;
    height: 22px;
  }
  .pill .pill-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--theme, var(--c-work));
    box-shadow: 0 0 7px var(--theme, var(--c-work));
  }
  .pill .pill-sub {
    color: var(--ink-4);
    margin-left: 2px;
  }

  .card-title {
    font-family: "Inter", sans-serif;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: -0.012em;
    line-height: 1.25;
    margin: 12px 0 7px;
    color: var(--ink);
  }
  .card-body {
    font-size: 13.5px;
    line-height: 1.55;
    color: var(--ink-2);
    margin: 0 0 16px;
    letter-spacing: 0.001em;
    text-wrap: pretty;
  }

  .actions { display: flex; gap: 6px; align-items: center; }
  .btn {
    font-family: "Inter", sans-serif;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.005em;
    padding: 8px 14px;
    border-radius: 10px;
    border: 1px solid transparent;
    cursor: pointer;
    transition: background 160ms ease, border-color 160ms ease, color 160ms ease;
  }
  .btn.primary {
    background: rgba(255,255,255,0.94);
    color: #0A0911;
  }
  .btn.primary:hover { background: rgba(255,255,255,1); }
  .btn.ghost {
    background: transparent;
    color: var(--ink-3);
  }
  .btn.ghost:hover { color: var(--ink); background: rgba(255,255,255,0.04); }
  .btn.icon {
    margin-left: auto;
    background: transparent;
    color: var(--ink-4);
    padding: 6px;
    border-radius: 8px;
    display: inline-flex;
  }
  .btn.icon:hover { color: var(--ink-2); background: rgba(255,255,255,0.04); }

  /* ─── card variants ────────────────────────────────────────────────── */
  .card.child {
    margin-left: 20px;
  }
  .card.child::before {
    content: "";
    position: absolute;
    left: -13px;
    top: -14px;
    width: 13px;
    height: 30px;
    border-left: 1px solid var(--glass-border);
    border-bottom: 1px solid var(--glass-border);
    border-bottom-left-radius: 10px;
  }
  .card.milestone {
    margin-left: 32px;
  }
  .card.milestone::before {
    content: "";
    position: absolute;
    left: -13px;
    top: -14px;
    width: 13px;
    height: 32px;
    border-left: 1px solid var(--glass-border);
    border-bottom: 1px solid var(--glass-border);
    border-bottom-left-radius: 10px;
  }
  .card.milestone .ms-marker {
    position: absolute;
    left: -19px;
    top: 24px;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--bg);
    border: 1px solid rgba(255,255,255,0.35);
  }
  .card.mark {
    border-left: 2px solid var(--c-work);
    padding-left: 16px;
  }

  /* ─── composer ─────────────────────────────────────────────────────── */
  .composer {
    border-top: 1px solid rgba(255,255,255,0.045);
    padding: 14px 20px 18px;
    background: rgba(7,6,10,0.4);
  }
  .composer-box {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--glass-border);
    border-radius: 14px;
    padding: 10px 10px 10px 14px;
  }
  .composer-input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--ink);
    font-family: inherit;
    font-size: 14px;
    line-height: 1.5;
    resize: none;
    height: 56px;
    padding-top: 6px;
  }
  .composer-input::placeholder { color: var(--ink-4); }
  .composer-btn {
    width: 36px; height: 36px;
    border-radius: 10px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--glass-border);
    color: var(--ink-2);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .composer-btn:hover { background: rgba(255,255,255,0.07); color: var(--ink); }
  .composer-btn.send {
    background: rgba(239,159,39,0.10);
    border-color: rgba(239,159,39,0.32);
    color: var(--c-work);
  }
  .composer-btn.send:hover { background: rgba(239,159,39,0.18); }
  .composer-foot {
    margin-top: 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-family: "JetBrains Mono", monospace;
    font-size: 10px;
    letter-spacing: 0.10em;
    color: var(--ink-4);
    text-transform: uppercase;
  }
  .composer-foot .kbd {
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--glass-border);
    border-radius: 4px;
    padding: 1px 5px;
    color: var(--ink-3);
    text-transform: none;
    letter-spacing: 0.02em;
  }

  /* ─── annotation layer ─────────────────────────────────────────────── */
  .anno-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 30;
    font-family: "JetBrains Mono", monospace;
    font-size: 10.5px;
    letter-spacing: 0.04em;
    color: var(--anno);
  }
  .anno-label {
    position: absolute;
    background: rgba(7,6,10,0.85);
    border: 1px solid rgba(239,159,39,0.35);
    padding: 3px 7px;
    border-radius: 4px;
    white-space: nowrap;
    line-height: 1.3;
  }
  .anno-label.dim {
    color: var(--ink-2);
    border-color: rgba(255,255,255,0.12);
  }
  .anno-line {
    position: absolute;
    border-top: 1px dashed rgba(239,159,39,0.45);
  }
  .anno-line.dim { border-top-color: rgba(255,255,255,0.18); }
  .anno-line.v {
    border-top: none;
    border-left: 1px dashed rgba(239,159,39,0.45);
  }
  .anno-line.v.dim { border-left-color: rgba(255,255,255,0.18); }
  .anno-dot {
    position: absolute;
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--anno);
    box-shadow: 0 0 6px rgba(239,159,39,0.5);
    transform: translate(-50%, -50%);
  }
  .anno-bracket-h {
    position: absolute;
    border-top: 1px solid rgba(239,159,39,0.5);
    border-left: 1px solid rgba(239,159,39,0.5);
    border-right: 1px solid rgba(239,159,39,0.5);
    height: 6px;
  }
  .anno-bracket-v {
    position: absolute;
    border-left: 1px solid rgba(239,159,39,0.5);
    border-top: 1px solid rgba(239,159,39,0.5);
    border-bottom: 1px solid rgba(239,159,39,0.5);
    width: 6px;
  }

  .hide-annos .anno-layer { display: none; }

</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="tweaks-panel.jsx"></script>

<script type="text/babel">
// ─── tree background ──────────────────────────────────────────────────
// 5 themed hubs around a central self-node, plus a handful of satellites.
// Lines are thin and faint; nodes are dark cores with bright rim + bloom.
const HUBS = [
  { id: "work",     color: "#EF9F27", x: 280, y: 240, r: 7,
    subs: [{x:400,y:130,r:4},{x:170,y:310,r:4},{x:380,y:340,r:3.2}] },
  { id: "money",    color: "#1D9E75", x: 830, y: 200, r: 7,
    subs: [{x:930,y:120,r:4},{x:960,y:300,r:3.2}] },
  { id: "becoming", color: "#7F77DD", x: 170, y: 540, r: 7,
    subs: [{x:60,y:460,r:3.2},{x:80,y:660,r:4}] },
  { id: "people",   color: "#D4537E", x: 760, y: 660, r: 7,
    subs: [{x:680,y:760,r:4},{x:880,y:720,r:3.2}] },
  { id: "health",   color: "#D85A30", x: 440, y: 760, r: 7,
    subs: [{x:330,y:830,r:3.6},{x:560,y:820,r:4}] },
];
const CENTER = { x: 540, y: 460 };

function TreeBackground() {
  return (
    <svg viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
      <defs>
        <filter id="bloom" x="-100%" y="-100%" width="300%" height="300%">
          <feGaussianBlur stdDeviation="6" />
        </filter>
        <filter id="bloom-tight" x="-100%" y="-100%" width="300%" height="300%">
          <feGaussianBlur stdDeviation="2" />
        </filter>
      </defs>

      {/* center → hub lines */}
      {HUBS.map(h => (
        <line key={"l-"+h.id}
          x1={CENTER.x} y1={CENTER.y}
          x2={h.x} y2={h.y}
          stroke="rgba(255,255,255,0.10)"
          strokeWidth="1" />
      ))}
      {/* hub → satellite lines */}
      {HUBS.flatMap(h => h.subs.map((s,i) => (
        <line key={"sl-"+h.id+"-"+i}
          x1={h.x} y1={h.y}
          x2={s.x} y2={s.y}
          stroke={h.color}
          strokeOpacity="0.18"
          strokeWidth="0.8" />
      )))}

      {/* center self-node */}
      <g>
        <circle cx={CENTER.x} cy={CENTER.y} r="22" fill="white" opacity="0.04" filter="url(#bloom)"/>
        <circle cx={CENTER.x} cy={CENTER.y} r="5" fill="#0A0911" />
        <circle cx={CENTER.x} cy={CENTER.y} r="5" fill="none" stroke="rgba(255,255,255,0.7)" strokeWidth="1" />
      </g>

      {/* themed hubs (bloom + core + rim) */}
      {HUBS.map(h => (
        <g key={"h-"+h.id}>
          <circle cx={h.x} cy={h.y} r={h.r * 5} fill={h.color} opacity="0.07" filter="url(#bloom)"/>
          <circle cx={h.x} cy={h.y} r={h.r * 2.6} fill={h.color} opacity="0.14" filter="url(#bloom-tight)"/>
          <circle cx={h.x} cy={h.y} r={h.r} fill="#0A0911" />
          <circle cx={h.x} cy={h.y} r={h.r} fill="none" stroke={h.color} strokeWidth="1.2" />
        </g>
      ))}

      {/* satellites */}
      {HUBS.flatMap(h => h.subs.map((s,i) => (
        <g key={"s-"+h.id+"-"+i}>
          <circle cx={s.x} cy={s.y} r={s.r * 3} fill={h.color} opacity="0.08" filter="url(#bloom-tight)"/>
          <circle cx={s.x} cy={s.y} r={s.r} fill="#0A0911" />
          <circle cx={s.x} cy={s.y} r={s.r} fill="none" stroke={h.color} strokeOpacity="0.85" strokeWidth="0.9" />
        </g>
      )))}
    </svg>
  );
}

// ─── cards ────────────────────────────────────────────────────────────
function HubPill({ color, name, sub }) {
  return (
    <span className="pill" style={{ ['--theme']: color }}>
      <span className="pill-dot"></span>
      {name}
      {sub && <span className="pill-sub">· {sub}</span>}
    </span>
  );
}

function CardActions() {
  return (
    <div className="actions">
      <button className="btn primary">Confirm</button>
      <button className="btn ghost">Skip</button>
      <button className="btn icon" title="More">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <circle cx="3" cy="7" r="1.1" fill="currentColor"/>
          <circle cx="7" cy="7" r="1.1" fill="currentColor"/>
          <circle cx="11" cy="7" r="1.1" fill="currentColor"/>
        </svg>
      </button>
    </div>
  );
}

function NewPursuitCard() {
  return (
    <div className="card">
      <div className="card-meta">
        <span>New pursuit</span>
        <span className="ago">· proposed just now</span>
      </div>
      <HubPill color="#EF9F27" name="Work & Career" />
      <h3 className="card-title">Negotiate promotion</h3>
      <p className="card-body">
        You've returned to this three times this week. Worth tracking as a pursuit on
        Work &amp; Career — we'll keep your thinking together as it develops.
      </p>
      <CardActions />
    </div>
  );
}

function ChildPursuitCard() {
  return (
    <div className="card child">
      <div className="card-meta">
        <span>Child pursuit</span>
        <span className="ago">· under Become senior IC</span>
      </div>
      <HubPill color="#EF9F27" name="Work & Career" />
      <h3 className="card-title">Lead the platform RFC review</h3>
      <p className="card-body">
        Mentioned on Tuesday in passing. Looks like a concrete way to demonstrate
        the breadth Priya keeps pointing to.
      </p>
      <CardActions />
    </div>
  );
}

function MilestoneCard() {
  return (
    <div className="card milestone">
      <span className="ms-marker"></span>
      <div className="card-meta">
        <span>Milestone</span>
        <span className="ago">· under Negotiate promotion</span>
      </div>
      <HubPill color="#EF9F27" name="Work & Career" />
      <h3 className="card-title">Book calibration conversation</h3>
      <p className="card-body">
        A 30-minute slot with Priya before the spring cycle opens.
        Confirming adds a reminder two weeks out.
      </p>
      <CardActions />
    </div>
  );
}

function MarkCard() {
  return (
    <div className="card mark">
      <div className="card-meta">
        <span>Timeline mark</span>
        <span className="ago">· today, 10:42</span>
      </div>
      <HubPill color="#EF9F27" name="Work & Career" />
      <h3 className="card-title">Priya floated "expanded scope" on Monday</h3>
      <p className="card-body">
        Logging on the Work timeline so it resurfaces the next time you
        return to Negotiate promotion.
      </p>
      <CardActions />
    </div>
  );
}

// ─── composer ─────────────────────────────────────────────────────────
function Composer() {
  return (
    <div className="composer">
      <div className="composer-box">
        <textarea
          className="composer-input"
          defaultValue="I keep coming back to the promotion thing. Priya said something about expanded scope on Monday — I want to think out loud about what that actually means before our calibration."
        />
        <button className="composer-btn" title="Voice">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round">
            <rect x="6" y="2" width="4" height="8" rx="2"/>
            <path d="M3.5 8 a4.5 4.5 0 0 0 9 0"/>
            <line x1="8" y1="12.5" x2="8" y2="14.5"/>
          </svg>
        </button>
        <button className="composer-btn send" title="Send">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
            <path d="M3 8 L13 8 M9 4 L13 8 L9 12"/>
          </svg>
        </button>
      </div>
      <div className="composer-foot">
        <span>Stream → 3 proposals queued</span>
        <span><span className="kbd">⌘</span> <span className="kbd">↵</span> send</span>
      </div>
    </div>
  );
}

// ─── annotation overlay ───────────────────────────────────────────────
// Absolute layout matches a 1440×900 viewport. Cards drop into the rail
// starting around y=120; rail starts at x=960.
function Annotations() {
  return (
    <div className="anno-layer">
      {/* rail width bracket along the top of the rail */}
      <div className="anno-bracket-h" style={{ left: 960, top: 8, width: 480 }}></div>
      <div className="anno-label" style={{ left: 1170, top: 16 }}>rail · 480 px</div>

      {/* card 1: radius, border, bg, title, body, padding */}
      <div className="anno-dot" style={{ left: 1410, top: 244 }}></div>
      <div className="anno-line" style={{ left: 1410, top: 244, width: 70 }}></div>
      <div className="anno-label" style={{ left: 1300, top: 230 }}>radius · 16</div>

      <div className="anno-dot" style={{ left: 988, top: 244 }}></div>
      <div className="anno-line" style={{ left: 924, top: 244, width: 64 }}></div>
      <div className="anno-label" style={{ left: 768, top: 230 }}>border · rgba(255,255,255,0.08)</div>

      <div className="anno-dot" style={{ left: 1020, top: 330 }}></div>
      <div className="anno-line" style={{ left: 832, top: 330, width: 188 }}></div>

// ─── app ──────────────────────────────────────────────────────────────
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "annotations": true,
  "treeDim": 0.40
}/*EDITMODE-END*/;

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

  React.useEffect(() => {
    document.body.classList.toggle('hide-annos', !t.annotations);
  }, [t.annotations]);

  return (
    <>
      <div className="viewport" data-screen-label="Stream Confirmation">
        <div className="tree-layer" style={{ opacity: t.treeDim }}>
          <TreeBackground />
        </div>

        <aside className="rail">
          <header className="rail-head">
            <div className="wordmark">Pathfinder<span className="dot"></span><span style={{color:'rgba(255,255,255,0.55)', fontFamily:'Inter', fontSize:13, fontWeight:400, letterSpacing:'0.04em'}}>Stream</span></div>
            <div className="rail-mode">
              <span className="live"></span>
              listening
            </div>
          </header>

          <div className="rail-context">
            <span className="crumb-dot"></span>
            <span>Work &amp; Career</span>
            <span className="sep">›</span>
            <span style={{color:'var(--ink-2)'}}>Become senior IC</span>
            <span className="sep">·</span>
            <span style={{color:'var(--ink-3)'}}>4 proposals</span>
          </div>

          <div className="rail-content">
            <NewPursuitCard />
            <ChildPursuitCard />
            <MilestoneCard />
            <MarkCard />
          </div>

          <Composer />
        </aside>

        {t.annotations && <Annotations />}
      </div>

      <TweaksPanel title="Tweaks" defaultPosition={{ left: 24, bottom: 24 }}>
        <TweakSection title="Spec overlay">
          <TweakToggle
            label="Show annotations"
            value={t.annotations}
            onChange={(v) => setTweak("annotations", v)}
          />
        </TweakSection>
        <TweakSection title="Tree">
          <TweakSlider
            label="Dim opacity"
            value={t.treeDim}
            min={0.10}
            max={1.00}
            step={0.05}
            onChange={(v) => setTweak("treeDim", v)}
          />
        </TweakSection>
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
