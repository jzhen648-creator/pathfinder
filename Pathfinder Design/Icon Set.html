<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Life domains · Icon set</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #07060A;
    --bg-soft: #0E0D14;
    --line: rgba(255,255,255,0.06);
    --line-strong: rgba(255,255,255,0.12);
    --ink: rgba(245,243,250,0.92);
    --ink-dim: rgba(245,243,250,0.55);
    --ink-mute: rgba(245,243,250,0.32);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Inter", system-ui, sans-serif;
    font-weight: 300;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  .page {
    max-width: 1240px;
    margin: 0 auto;
    padding: 72px 64px 120px;
  }
  .head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding-bottom: 28px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 64px;
  }
  .head h1 {
    font-size: 15px;
    font-weight: 500;
    letter-spacing: 0.02em;
    margin: 0;
    color: var(--ink);
  }
  .head .meta {
    font-family: "JetBrains Mono", monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-mute);
  }
  .section-label {
    font-family: "JetBrains Mono", monospace;
    font-size: 10.5px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-mute);
    margin-bottom: 36px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .section-label::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--line);
  }

  /* HERO ROW — large showcase */
  .hero {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 24px;
    margin-bottom: 96px;
  }
  .hero-cell {
    aspect-ratio: 1 / 1.15;
    border: 1px solid var(--line);
    border-radius: 4px;
    background:
      radial-gradient(circle at 50% 42%, rgba(255,255,255,0.018), transparent 60%),
      var(--bg-soft);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    padding: 24px;
    transition: border-color 200ms ease;
  }
  .hero-cell:hover { border-color: var(--line-strong); }
  .hero-cell .icon-wrap { flex: 1; display: flex; align-items: center; justify-content: center; }
  .hero-cell .name {
    font-size: 13px;
    letter-spacing: 0.04em;
    color: var(--ink);
    font-weight: 400;
  }
  .hero-cell .hint {
    font-family: "JetBrains Mono", monospace;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-mute);
    margin-top: -16px;
  }

  /* SPEC ROW — actual 48px target */
  .spec {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 24px;
    margin-bottom: 96px;
  }
  .spec-cell {
    display: flex;
    flex-direction: column;
    gap: 18px;
    padding: 24px 0;
    border-top: 1px solid var(--line);
  }
  .spec-row {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .spec-row .size-tag {
    font-family: "JetBrains Mono", monospace;
    font-size: 10px;
    color: var(--ink-mute);
    letter-spacing: 0.08em;
    min-width: 36px;
  }
  .spec-row .swatch {
    background: var(--bg-soft);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .spec-meta {
    font-family: "JetBrains Mono", monospace;
    font-size: 10.5px;
    letter-spacing: 0.06em;
    color: var(--ink-dim);
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .spec-meta .name { color: var(--ink); letter-spacing: 0.02em; }
  .spec-meta .hex { color: var(--ink-mute); }

  /* IN-CONTEXT — mock nav list */
  .context {
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--bg-soft);
    padding: 8px;
    max-width: 420px;
  }
  .context-row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 14px;
    border-radius: 4px;
    cursor: pointer;
    transition: background 160ms ease;
  }
  .context-row:hover { background: rgba(255,255,255,0.025); }
  .context-row.active { background: rgba(255,255,255,0.04); }
  .context-row .text {
    flex: 1;
    font-size: 14px;
    color: var(--ink);
    letter-spacing: 0.005em;
  }
  .context-row .chev {
    color: var(--ink-mute);
    font-size: 14px;
  }
  .context-wrap {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 48px;
    align-items: start;
  }
  .context-note {
    font-size: 13px;
    line-height: 1.6;
    color: var(--ink-dim);
    font-weight: 300;
    max-width: 360px;
  }
  .context-note strong { color: var(--ink); font-weight: 500; }
  .context-note .k {
    font-family: "JetBrains Mono", monospace;
    font-size: 11px;
    color: var(--ink);
    background: rgba(255,255,255,0.04);
    padding: 1px 6px;
    border-radius: 3px;
    margin: 0 1px;
  }

  /* tweaks tweaks-panel reset overrides */
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="icons.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>

<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "stroke": 1.25,
  "heroSize": 100,
  "specSize": 48,
  "monochrome": false,
  "monoColor": "#F5F3FA",
  "showRing": true
}/*EDITMODE-END*/;

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

  // Optional monochrome override — gives a uniform "single colour" set look.
  const colorFor = (c) => t.monochrome ? t.monoColor : c;

  // If ring is hidden, wrap icons to suppress the outer circle by clipping.
  // Easiest: pass through a higher-order render that strips outer circle.
  const renderIcon = (Comp, color, size) => (
    <Comp size={size} color={color} stroke={t.stroke} />
  );

  return (
    <>
      <div className="page">
        <div className="head">
          <h1>Life domains · Icon set</h1>
          <div className="meta">v1 · 5 icons · 48px target</div>
        </div>

        <div className="section-label">Hero</div>
        <div className="hero">
          {ICONS.map(({ id, label, hint, color, Comp }) => (
            <div className="hero-cell" key={id}>
              <div className="icon-wrap">
                {renderIcon(Comp, colorFor(color), t.heroSize)}
              </div>
              <div className="name">{label}</div>
              <div className="hint">{hint}</div>
            </div>
          ))}
        </div>

        <div className="section-label">Target — 48px</div>
        <div className="spec">
          {ICONS.map(({ id, label, hint, color, Comp }) => (
            <div className="spec-cell" key={id}>
              <div className="spec-row">
                <div className="size-tag">48</div>
                <div className="swatch">{renderIcon(Comp, colorFor(color), t.specSize)}</div>
              </div>
              <div className="spec-row">
                <div className="size-tag">32</div>
                <div className="swatch">{renderIcon(Comp, colorFor(color), 32)}</div>
              </div>
              <div className="spec-row">
                <div className="size-tag">24</div>
                <div className="swatch">{renderIcon(Comp, colorFor(color), 24)}</div>
              </div>
              <div className="spec-meta">
                <span className="name">{label}</span>
                <span className="hex">{(t.monochrome ? t.monoColor : color).toUpperCase()}</span>
              </div>
            </div>
          ))}
        </div>

        <div className="section-label">In context</div>
        <div className="context-wrap">
          <div className="context">
            {ICONS.map(({ id, label, color, Comp }, i) => (
              <div className={"context-row" + (i === 2 ? " active" : "")} key={id}>
                {renderIcon(Comp, colorFor(color), 28)}
                <span className="text">{label}</span>
                <span className="chev">›</span>
              </div>
            ))}
          </div>
          <div className="context-note">
            Each icon sits in a <strong>48px circle</strong> with a consistent
            <span className="k">1.5px</span> stroke, rounded caps and joins.
            They render as a single colour each on transparent ground — the
            outer ring is part of the icon, not a container. Flip
            <span className="k">monochrome</span> in Tweaks to preview the set
            unified to one colour, or pull the stroke down to
            <span className="k">1px</span> for tighter UI density.
          </div>
        </div>
      </div>

      <TweaksPanel title="Tweaks" defaultPosition={{ right: 24, bottom: 24 }}>
        <TweakSection title="Stroke">
          <TweakSlider
            label="Weight"
            value={t.stroke}
            min={0.75}
            max={2.5}
            step={0.25}
            onChange={(v) => setTweak("stroke", v)}
            suffix="px"
          />
        </TweakSection>
        <TweakSection title="Sizing">
          <TweakSlider
            label="Hero size"
            value={t.heroSize}
            min={64}
            max={180}
            step={4}
            onChange={(v) => setTweak("heroSize", v)}
            suffix="px"
          />
        </TweakSection>
        <TweakSection title="Colour mode">
          <TweakToggle
            label="Monochrome"
            value={t.monochrome}
            onChange={(v) => setTweak("monochrome", v)}
          />
          {t.monochrome && (
            <TweakColor
              label="Mono colour"
              value={t.monoColor}
              options={["#F5F3FA", "#F5B544", "#4FD1C5", "#B07CFF", "#F472B6", "#FF8A65"]}
              onChange={(v) => setTweak("monoColor", v)}
            />
          )}
        </TweakSection>
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
