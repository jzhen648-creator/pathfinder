<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pathfinder · Tree map redesign</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family: "Inter", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  @keyframes pf-pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%      { opacity: 0.55; transform: scale(0.85); }
  }
  @keyframes pf-blink {
    0%, 100% { opacity: 0.8; }
    50%      { opacity: 0; }
  }
  *::-webkit-scrollbar { width: 8px; height: 8px; }
  *::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 4px; }
  *::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="pf-data.jsx"></script>
<script type="text/babel" src="pf-tree.jsx"></script>
<script type="text/babel" src="pf-icons.jsx"></script>
<script type="text/babel" src="pf-trunk-layout.jsx"></script>
<script type="text/babel" src="pf-trunk-view.jsx"></script>
<script type="text/babel" src="pf-pursuit-panel.jsx"></script>
<script type="text/babel" src="pf-pursuit-artboards.jsx"></script>
<script type="text/babel" src="pf-app.jsx"></script>
<script type="text/babel" src="pf-grammar.jsx"></script>
<script type="text/babel" src="pf-crop.jsx"></script>

<script type="text/babel">
function App() {
  return (
    <DesignCanvas>
      <DCSection id="prototype" title="01 · Trunk poster · interactive"
        subtitle="Trunk-first life map. Mind & Spirit crowns the top · Work + Money left · People + Health right. Click any node, then ‘C · Stream active’ along the bottom to enter the confirmation flow.">
        <DCArtboard id="hero" label="Pathfinder · /tree" width={1440} height={900}>
          <DesktopPathfinder/>
        </DCArtboard>
      </DCSection>

      <DCSection id="pursuit-panel" title="02 · Pursuit panel"
        subtitle="What opens when a goal is clicked on the tree. Three views — in context, anatomy, states.">
        <DCArtboard id="pursuit-context" label="In context" width={1440} height={900}>
          <PFPursuitInContext/>
        </DCArtboard>
        <DCArtboard id="pursuit-spec"    label="Anatomy"     width={1180} height={900}>
          <PFPursuitSpec/>
        </DCArtboard>
        <DCArtboard id="pursuit-states"  label="States"      width={1620} height={920}>
          <PFPursuitStates/>
        </DCArtboard>
      </DCSection>

      <DCSection id="crop" title="03 · Work region · zoomed"
        subtitle="One theme close-up. Gateway → hubs → goals orbiting hubs → moment on a spoke. All grammar parts labeled.">
        <DCArtboard id="work-crop" label="Work region" width={1320} height={820}>
          <PFWorkCrop/>
        </DCArtboard>
      </DCSection>

      <DCSection id="system" title="04 · System"
        subtitle="Visual hierarchy + design tokens.">
        <DCArtboard id="hierarchy" label="Visual hierarchy" width={720} height={760}>
          <PFHierarchy/>
        </DCArtboard>
        <DCArtboard id="tokens-strip" label="Tokens" width={1180} height={540}>
          <PFTokens/>
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
