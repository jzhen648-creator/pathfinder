<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Pathfinder · Print</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  @page { size: landscape; margin: 0; }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: #07060A;
    font-family: "Inter", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  /* Each page = full viewport in screen mode; CSS @page in print mode */
  .pf-page {
    width: 100vw;
    height: 100vh;
    background: #07060A;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
    page-break-after: always;
    break-after: page;
  }
  .pf-page:last-child {
    page-break-after: avoid;
    break-after: avoid;
  }
  .pf-stage {
    transform-origin: center center;
    position: relative;
    flex-shrink: 0;
  }
  .pf-pagelabel {
    position: absolute;
    top: 20px;
    left: 28px;
    font: 500 10.5px "JetBrains Mono", monospace;
    color: rgba(255,255,255,0.42);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    z-index: 100;
    pointer-events: none;
  }
  .pf-pagelabel .num { color: rgba(255,255,255,0.85); }

  /* Print-only: disable any pulse/blink animations (no value in static) */
  @media print {
    *, *::before, *::after {
      animation: none !important;
      transition: none !important;
    }
    html, body { background: #07060A; }
  }

  /* Re-declare keyframes used by tree's preview hex (for screen view) */
  @keyframes pf-pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%      { opacity: 0.55; transform: scale(0.85); }
  }
  @keyframes pf-blink {
    0%, 100% { opacity: 0.8; }
    50%      { opacity: 0; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="pf-data.jsx"></script>
<script type="text/babel" src="pf-tree.jsx"></script>
<script type="text/babel" src="pf-icons.jsx"></script>
<script type="text/babel" src="pf-trunk-layout.jsx"></script>
<script type="text/babel" src="pf-trunk-view.jsx"></script>
<script type="text/babel" src="pf-app.jsx"></script>
<script type="text/babel" src="pf-grammar.jsx"></script>
<script type="text/babel" src="pf-crop.jsx"></script>

<script type="text/babel">
// One page per artboard. Each artboard renders at its intrinsic size,
// scaled to fit the viewport (which IS the printed page).
function PFPage({ width, height, label, children }) {
  const ref = React.useRef(null);
  const [scale, setScale] = React.useState(1);

  React.useLayoutEffect(() => {
    const fit = () => {
      const el = ref.current;
      if (!el) return;
      const pw = el.clientWidth - 32;
      const ph = el.clientHeight - 32;
      setScale(Math.min(pw / width, ph / height));
    };
    fit();
    window.addEventListener("resize", fit);
    // Re-fit just before print
    const beforePrint = () => fit();
    window.addEventListener("beforeprint", beforePrint);
    return () => {
      window.removeEventListener("resize", fit);
      window.removeEventListener("beforeprint", beforePrint);
    };
  }, [width, height]);

  return (
    <div className="pf-page" ref={ref}>
      {label && (
        <div className="pf-pagelabel">
          <span className="num">{label.num}</span> · {label.text}
        </div>
      )}
      <div className="pf-stage" style={{
        width, height,
        transform: `scale(${scale})`,
      }}>
        {children}
      </div>
    </div>
  );
}

function App() {
  return (
    <>
      <PFPage width={1440} height={900} label={{ num:"01", text:"Trunk poster · Hub selected (B)" }}>
        <DesktopPathfinder/>
      </PFPage>

      <PFPage width={1320} height={820} label={{ num:"02", text:"Work region · zoomed" }}>
        <PFWorkCrop/>
      </PFPage>

      <PFPage width={720} height={760} label={{ num:"03", text:"Visual hierarchy" }}>
        <PFHierarchy/>
      </PFPage>

      <PFPage width={1180} height={540} label={{ num:"04", text:"Design tokens" }}>
        <PFTokens/>
      </PFPage>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);

// Auto-print once fonts + layout settle.
(async () => {
  try {
    if (document.fonts && document.fonts.ready) {
      await document.fonts.ready;
    }
  } catch (e) { /* ignore */ }
  // Generous delay to let React render + Babel transforms settle.
  setTimeout(() => { window.print(); }, 1200);
})();
</script>
</body>
</html>
