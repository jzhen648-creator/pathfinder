<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Pathfinder Icon System v2</title>
<style>
  :root { --t: #e8e4dc; --bg: #111210; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--t); font-family: 'Geist', system-ui, sans-serif; padding: 40px 32px; }
  h1 { font-size: 15px; font-weight: 500; letter-spacing: 0.02em; margin-bottom: 4px; }
  p  { font-size: 11px; opacity: 0.4; margin-bottom: 32px; }
  svg text { font-family: system-ui, sans-serif; fill: #e8e4dc; }
  .th { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; }
  .tn { font-size: 10px; font-weight: 400; opacity: 0.55; }
  .tl { font-size: 9px; font-weight: 400; opacity: 0.35; }
</style>
</head>
<body>
<h1>Pathfinder — Icon System v2</h1>
<p>5 themes · 17 hubs · consistent scale</p>

<svg width="100%" viewBox="0 0 600 470" xmlns="http://www.w3.org/2000/svg">

  <!-- Column headers -->
  <text class="th" x="60"  y="18" text-anchor="middle">Work</text>
  <text class="th" x="180" y="18" text-anchor="middle">Money</text>
  <text class="th" x="300" y="18" text-anchor="middle">Becoming</text>
  <text class="th" x="420" y="18" text-anchor="middle">People</text>
  <text class="th" x="540" y="18" text-anchor="middle">Health</text>

  <!-- ======================== LIMB SYMBOLS ======================== -->

  <!-- Work: Rising blocks -->
  <g transform="translate(60,70)">
    <rect x="-13" y="1" width="8" height="11" fill="none" stroke="#e8e4dc" stroke-width="1.5" stroke-linejoin="round"/>
    <rect x="-3" y="-6" width="8" height="18" fill="none" stroke="#e8e4dc" stroke-width="1.5" stroke-linejoin="round"/>
    <rect x="7" y="-13" width="8" height="25" fill="none" stroke="#e8e4dc" stroke-width="1.5" stroke-linejoin="round"/>
  </g>

  <!-- Money: Banknote -->
  <g transform="translate(180,70)">
    <rect x="-14" y="-8" width="28" height="16" rx="1.5" fill="none" stroke="#e8e4dc" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="4.5" fill="none" stroke="#e8e4dc" stroke-width="1.2"/>
    <line x1="-10" y1="-4" x2="-10" y2="4" stroke="#e8e4dc" stroke-width="0.9" opacity="0.4"/>
    <line x1="10" y1="-4" x2="10" y2="4" stroke="#e8e4dc" stroke-width="0.9" opacity="0.4"/>
  </g>

  <!-- Becoming: Yin yang -->
  <g transform="translate(300,70)">
    <circle cx="0" cy="0" r="12" fill="none" stroke="#e8e4dc" stroke-width="1.5"/>
    <path d="M0,-12 A6,6 0 0,1 0,0 A6,6 0 0,0 0,12" fill="none" stroke="#e8e4dc" stroke-width="1.3" stroke-linecap="round"/>
    <circle cx="0" cy="-6" r="2" fill="#e8e4dc"/>
    <circle cx="0" cy="6" r="2" fill="none" stroke="#e8e4dc" stroke-width="1.1"/>
  </g>

  <!-- People: Two figures -->
  <g transform="translate(420,70)">
    <circle cx="-5" cy="-7" r="3" fill="none" stroke="#e8e4dc" stroke-width="1.4"/>
    <path d="M-9,6 Q-9,0 -5,-2 Q-1,0 -1,6" fill="none" stroke="#e8e4dc" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="5" cy="-7" r="3" fill="none" stroke="#e8e4dc" stroke-width="1.4"/>
    <path d="M1,6 Q1,0 5,-2 Q9,0 9,6" fill="none" stroke="#e8e4dc" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Health: ECG pulse -->
  <g transform="translate(540,70)">
    <polyline points="-15,0 -4,0 -2,-13 0,8 2,0 15,0" fill="none" stroke="#e8e4dc" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Limb labels -->
  <text class="tl" x="60"  y="93" text-anchor="middle">limb</text>
  <text class="tl" x="180" y="93" text-anchor="middle">limb</text>
  <text class="tl" x="300" y="93" text-anchor="middle">limb</text>
  <text class="tl" x="420" y="93" text-anchor="middle">limb</text>
  <text class="tl" x="540" y="93" text-anchor="middle">limb</text>

  <!-- Separator -->
  <line x1="20" y1="105" x2="580" y2="105" stroke="#e8e4dc" stroke-width="0.5" opacity="0.1"/>

  <!-- ======================== BRANCH ROW 1 ======================== -->

  <!-- Career: Ladder -->
  <g transform="translate(60,145)">
    <line x1="-6" y1="-11" x2="-6" y2="11" stroke="#e8e4dc" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="6" y1="-11" x2="6" y2="11" stroke="#e8e4dc" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="-6" y1="-7" x2="6" y2="-7" stroke="#e8e4dc" stroke-width="1.1" stroke-linecap="round"/>
    <line x1="-6" y1="0" x2="6" y2="0" stroke="#e8e4dc" stroke-width="1.1" stroke-linecap="round"/>
    <line x1="-6" y1="7" x2="6" y2="7" stroke="#e8e4dc" stroke-width="1.1" stroke-linecap="round"/>
  </g>
  <text class="tn" x="60" y="168" text-anchor="middle">Career</text>

  <!-- Income: Arrow into coin -->
  <g transform="translate(180,145)">
    <circle cx="0" cy="4" r="8" fill="none" stroke="#e8e4dc" stroke-width="1.3"/>
    <line x1="0" y1="-11" x2="0" y2="-3" stroke="#e8e4dc" stroke-width="1.3" stroke-linecap="round"/>
    <polyline points="-3.5,-6 0,-2 3.5,-6" fill="none" stroke="#e8e4dc" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text class="tn" x="180" y="168" text-anchor="middle">Income</text>

  <!-- Purpose: Compass -->
  <g transform="translate(300,145)">
    <circle cx="0" cy="0" r="10" fill="none" stroke="#e8e4dc" stroke-width="1.3"/>
    <polygon points="0,-7 2.5,0 0,3 -2.5,0" fill="none" stroke="#e8e4dc" stroke-width="1.1" stroke-linejoin="round"/>
    <circle cx="0" cy="0" r="1.5" fill="#e8e4dc"/>
    <line x1="0" y1="-10" x2="0" y2="-8" stroke="#e8e4dc" stroke-width="1" opacity="0.4"/>
    <line x1="10" y1="0" x2="8" y2="0" stroke="#e8e4dc" stroke-width="1" opacity="0.4"/>
    <line x1="-10" y1="0" x2="-8" y2="0" stroke="#e8e4dc" stroke-width="1" opacity="0.4"/>
    <line x1="0" y1="10" x2="0" y2="8" stroke="#e8e4dc" stroke-width="1" opacity="0.4"/>
  </g>
  <text class="tn" x="300" y="168" text-anchor="middle">Purpose</text>

  <!-- Family: House -->
  <g transform="translate(420,145)">
    <polyline points="-10,0 0,-10 10,0" fill="none" stroke="#e8e4dc" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="-8" y1="0" x2="-8" y2="10" stroke="#e8e4dc" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="8" y1="0" x2="8" y2="10" stroke="#e8e4dc" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="-8" y1="10" x2="8" y2="10" stroke="#e8e4dc" stroke-width="1.3" stroke-linecap="round"/>
    <rect x="-3" y="3" width="6" height="7" fill="none" stroke="#e8e4dc" stroke-width="1.1"/>
  </g>
  <text class="tn" x="420" y="168" text-anchor="middle">Family</text>

  <!-- Movement: Lightning bolt -->
  <g transform="translate(540,145)">
    <path d="M4,-12 L-3,0 L2,0 L-4,12" fill="none" stroke="#e8e4dc" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text class="tn" x="540" y="168" text-anchor="middle">Movement</text>

  <!-- ======================== BRANCH ROW 2 ======================== -->

  <!-- Skills: Double chevrons -->
  <g transform="translate(60,215)">
    <polyline points="-8,-2 0,-11 8,-2" fill="none" stroke="#e8e4dc" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="-8,7 0,-2 8,7" fill="none" stroke="#e8e4dc" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
  </g>
  <text class="tn" x="60" y="238" text-anchor="middle">Skills</text>

  <!-- Investing: Growth chart -->
  <g transform="translate(180,215)">
    <line x1="-10" y1="9" x2="-10" y2="-9" stroke="#e8e4dc" stroke-width="1" stroke-linecap="round" opacity="0.4"/>
    <line x1="-10" y1="9" x2="10" y2="9" stroke="#e8e4dc" stroke-width="1" stroke-linecap="round" opacity="0.4"/>
    <polyline points="-8,7 -4,1 0,4 4,-5 8,-8" fill="none" stroke="#e8e4dc" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="5,-8 8,-8 8,-5" fill="none" stroke="#e8e4dc" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text class="tn" x="180" y="238" text-anchor="middle">Investing</text>

  <!-- Spirituality: Christian cross -->
  <g transform="translate(300,215)">
    <line x1="0" y1="-11" x2="0" y2="11" stroke="#e8e4dc" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="-7" y1="-4" x2="7" y2="-4" stroke="#e8e4dc" stroke-width="1.4" stroke-linecap="round"/>
  </g>
  <text class="tn" x="300" y="238" text-anchor="middle">Spirituality</text>

  <!-- Romance: Heart -->
  <g transform="translate(420,215)">
    <path d="M0,9 C-10,2 -12,-7 -6,-9 C-2,-9 0,-6 0,-3 C0,-6 2,-9 6,-9 C12,-7 10,2 0,9 Z" fill="none" stroke="#e8e4dc" stroke-width="1.3" stroke-linejoin="round"/>
  </g>
  <text class="tn" x="420" y="238" text-anchor="middle">Romance</text>

  <!-- Mind: Circle + brainwave -->
  <g transform="translate(540,215)">
    <circle cx="0" cy="0" r="10" fill="none" stroke="#e8e4dc" stroke-width="1.3"/>
    <path d="M-6,0 Q-3,-5 0,0 Q3,5 6,0" fill="none" stroke="#e8e4dc" stroke-width="1.1" stroke-linecap="round"/>
  </g>
  <text class="tn" x="540" y="238" text-anchor="middle">Mind</text>

  <!-- ======================== BRANCH ROW 3 ======================== -->

  <!-- Projects: Rocket -->
  <g transform="translate(60,285)">
    <path d="M0,-12 Q7,-12 7,-4 L7,5 Q7,9 0,9 Q-7,9 -7,5 L-7,-4 Q-7,-12 0,-12 Z" fill="none" stroke="#e8e4dc" stroke-width="1.3" stroke-linejoin="round"/>
    <circle cx="0" cy="-1" r="2.5" fill="none" stroke="#e8e4dc" stroke-width="1.1"/>
    <line x1="-7" y1="3" x2="-11" y2="9" stroke="#e8e4dc" stroke-width="1.1" stroke-linecap="round"/>
    <line x1="7" y1="3" x2="11" y2="9" stroke="#e8e4dc" stroke-width="1.1" stroke-linecap="round"/>
    <path d="M-3,9 Q0,13 3,9" fill="none" stroke="#e8e4dc" stroke-width="1" stroke-linecap="round" opacity="0.55"/>
  </g>
  <text class="tn" x="60" y="308" text-anchor="middle">Projects</text>

  <!-- Protection: Shield -->
  <g transform="translate(180,285)">
    <path d="M0,-10 L9,-7 L9,1 Q9,7 0,11 Q-9,7 -9,1 L-9,-7 Z" fill="none" stroke="#e8e4dc" stroke-width="1.3" stroke-linejoin="round"/>
  </g>
  <text class="tn" x="180" y="308" text-anchor="middle">Protection</text>

  <!-- Inner work: Mirror -->
  <g transform="translate(300,285)">
    <ellipse cx="0" cy="-2" rx="7" ry="9" fill="none" stroke="#e8e4dc" stroke-width="1.3"/>
    <line x1="0" y1="7" x2="0" y2="12" stroke="#e8e4dc" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-3" y1="10" x2="3" y2="10" stroke="#e8e4dc" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="-3" y1="-6" x2="2" y2="-2" stroke="#e8e4dc" stroke-width="0.8" stroke-linecap="round" opacity="0.35"/>
  </g>
  <text class="tn" x="300" y="308" text-anchor="middle">Inner work</text>

  <!-- Friendships: Interlinked circles -->
  <g transform="translate(420,285)">
    <circle cx="-4" cy="0" r="7" fill="none" stroke="#e8e4dc" stroke-width="1.3"/>
    <circle cx="4" cy="0" r="7" fill="none" stroke="#e8e4dc" stroke-width="1.3"/>
  </g>
  <text class="tn" x="420" y="308" text-anchor="middle">Friendships</text>

  <!-- Sleep: Crescent moon -->
  <g transform="translate(540,285)">
    <path d="M2,-10 Q-12,-10 -12,0 Q-12,10 2,10 Q-2,6 -2,0 Q-2,-6 2,-10 Z" fill="none" stroke="#e8e4dc" stroke-width="1.3" stroke-linejoin="round"/>
  </g>
  <text class="tn" x="540" y="308" text-anchor="middle">Sleep</text>

  <!-- ======================== BRANCH ROW 4 ======================== -->

  <!-- Network: Connected nodes -->
  <g transform="translate(60,355)">
    <circle cx="-8" cy="-6" r="2.2" fill="#e8e4dc"/>
    <circle cx="8" cy="-6" r="2.2" fill="#e8e4dc"/>
    <circle cx="0" cy="8" r="2.2" fill="#e8e4dc"/>
    <line x1="-7" y1="-5" x2="-1" y2="7" stroke="#e8e4dc" stroke-width="1.1" stroke-linecap="round"/>
    <line x1="7" y1="-5" x2="1" y2="7" stroke="#e8e4dc" stroke-width="1.1" stroke-linecap="round"/>
    <line x1="-6" y1="-6" x2="6" y2="-6" stroke="#e8e4dc" stroke-width="1.1" stroke-linecap="round"/>
  </g>
  <text class="tn" x="60" y="378" text-anchor="middle">Network</text>

  <!-- Giving: Open hand + rising dots -->
  <g transform="translate(180,355)">
    <path d="M-8,6 Q-9,0 -3,0 L3,0 Q9,0 8,6" fill="none" stroke="#e8e4dc" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="-8" y1="6" x2="-8" y2="10" stroke="#e8e4dc" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="8" y1="6" x2="8" y2="10" stroke="#e8e4dc" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="-8" y1="10" x2="8" y2="10" stroke="#e8e4dc" stroke-width="1.3" stroke-linecap="round"/>
    <circle cx="-3" cy="-5" r="1.5" fill="#e8e4dc" opacity="0.65"/>
    <circle cx="0" cy="-8" r="1.5" fill="#e8e4dc" opacity="0.45"/>
    <circle cx="3" cy="-5" r="1.5" fill="#e8e4dc" opacity="0.65"/>
  </g>
  <text class="tn" x="180" y="378" text-anchor="middle">Giving</text>

  <!-- Habits: Clock face -->
  <g transform="translate(300,355)">
    <circle cx="0" cy="0" r="10" fill="none" stroke="#e8e4dc" stroke-width="1.3"/>
    <line x1="0" y1="0" x2="-4" y2="-5" stroke="#e8e4dc" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="0" y2="-7" stroke="#e8e4dc" stroke-width="1.2" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="1.4" fill="#e8e4dc"/>
    <line x1="0" y1="-10" x2="0" y2="-8.5" stroke="#e8e4dc" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
    <line x1="10" y1="0" x2="8.5" y2="0" stroke="#e8e4dc" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
    <line x1="0" y1="10" x2="0" y2="8.5" stroke="#e8e4dc" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
    <line x1="-10" y1="0" x2="-8.5" y2="0" stroke="#e8e4dc" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
  </g>
  <text class="tn" x="300" y="378" text-anchor="middle">Habits</text>

  <!-- Community: Dot cluster -->
  <g transform="translate(420,355)">
    <circle cx="0" cy="-8" r="2.2" fill="#e8e4dc"/>
    <circle cx="-7" cy="2" r="2.2" fill="#e8e4dc"/>
    <circle cx="7" cy="2" r="2.2" fill="#e8e4dc"/>
    <circle cx="-3" cy="9" r="1.8" fill="#e8e4dc" opacity="0.55"/>
    <circle cx="3" cy="9" r="1.8" fill="#e8e4dc" opacity="0.55"/>
  </g>
  <text class="tn" x="420" y="378" text-anchor="middle">Community</text>

  <!-- Nutrition: Leaf -->
  <g transform="translate(540,355)">
    <path d="M0,-11 Q10,-6 9,4 Q6,10 0,11 Q-6,10 -9,4 Q-10,-6 0,-11 Z" fill="none" stroke="#e8e4dc" stroke-width="1.3" stroke-linejoin="round"/>
    <line x1="0" y1="-5" x2="0" y2="9" stroke="#e8e4dc" stroke-width="0.9" stroke-linecap="round" opacity="0.5"/>
    <line x1="0" y1="1" x2="5" y2="-3" stroke="#e8e4dc" stroke-width="0.7" stroke-linecap="round" opacity="0.4"/>
    <line x1="0" y1="5" x2="-4" y2="2" stroke="#e8e4dc" stroke-width="0.7" stroke-linecap="round" opacity="0.4"/>
  </g>
  <text class="tn" x="540" y="378" text-anchor="middle">Nutrition</text>

  <!-- Bottom legend -->
  <line x1="20" y1="400" x2="580" y2="400" stroke="#e8e4dc" stroke-width="0.5" opacity="0.08"/>
  <text class="tl" x="20" y="418" opacity="0.35">Row 1: Career · Income · Purpose · Family · Movement</text>
  <text class="tl" x="20" y="432" opacity="0.35">Row 2: Skills · Investing · Spirituality · Romance · Mind</text>
  <text class="tl" x="20" y="446" opacity="0.35">Row 3: Projects · Protection · Inner work · Friendships · Sleep</text>
  <text class="tl" x="20" y="460" opacity="0.35">Row 4: Network · Giving · Habits · Community · Nutrition</text>

</svg>
</body>
</html>
